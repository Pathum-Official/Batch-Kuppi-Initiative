# 💻 ICT 1022 - Computer Systems Architecture

## 🧩 Instruction Format
### Anatomy of an Instruction
- **Opcode (Action):** What to do (e.g., ADD, LOAD)
- **Operand (Data/Location):** Where/What to do it on

### Instruction Types
- **0-address (Implied):** Opcode only (e.g., HALT)
- **1-address (Accumulator):** Opcode + 1 location
- **2-address (Memory/Registers):** Opcode + 2 locations
- **Register-Memory:** Reg + Mem interaction
- **Register-Register (Fastest):** Uses only CPU registers

### 32-bit Instruction Encoding
- **Opcode Field:** Determines the operation (e.g., 6 bits)
- **Destination Register:** Where result goes
- **Source Registers:** The inputs
- **Immediate Data / ALU Function:** Constant values or specific math function

## 🎯 Addressing Modes
- **Immediate:** Data in Instruction (Fastest)
- **Direct:** Single Memory Access
- **Indirect:** Pointer/Two Memory Accesses (Slower)
- **Register:** Internal CPU Memory
- **Register Indirect:** Pointer in Register
- **Relative:** PC + Offset (Relocatable Code)
- **Indexed:** Base + Index (Array Access)
- **Stack:** Top of Stack implicitly

## ⚖️ CISC vs RISC Architecture
### CISC (Complex)
- Variable-length instructions
- Hardware-driven complexity
- Many addressing modes
- Fewer registers (e.g., VAX)

### RISC (Reduced)
- Fixed-length instructions (32-bit)
- Software-driven (Compiler handles complexity)
- Load-Store architecture (Only LD/ST touch memory)
- Many registers (e.g., 32 GPRs in MIPS)
- Pipelining focus (Speed)

### Intel Hybrid Strategy
- x86 dominates desktop/server
- Translates CISC instructions into RISC-like micro-ops internally

## ⚙️ MIPS32 Architecture
### CPU Registers
- **General Purpose (GPRs):** 32-bit, 32 of them
- **Program Counter (PC):** Address of next instruction
- **HI & LO:** For Multiply/Divide answers

### Assembly Conventions
- **$zero (R0):** Hard-wired zero (0)
- **$v0, $v1:** Function return values
- **$a0-$a3:** Function arguments
- **$t0-$t9:** Temporary values
- **$s0-$s7:** Saved values
- **$sp (R29):** Stack pointer
- **$ra (R31):** Return address

### MIPS Philosophy
- Simplicity favors regularity
- No dedicated PUSH/POP
- No dedicated Flag registers (prevents pipeline stalls)
