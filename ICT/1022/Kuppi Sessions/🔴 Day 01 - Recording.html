<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kuppi Session | Day 01 - Recording</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Sinhala:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: transparent;
                --card-bg: #1e293b;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', 'Noto Sans Sinhala', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .video-container { background: var(--card-bg); border-radius: 20px; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); width: 100%; max-width: 900px; overflow: hidden; animation: fadeIn 0.5s ease; border: 1px solid rgba(0,0,0,0.05); }
        .video-header { padding: 25px 30px; border-bottom: 1px solid rgba(0,0,0,0.05); display: flex; align-items: center; gap: 15px; }
        .video-header i { font-size: 2.5rem; color: #ef4444; }
        .video-title h1 { font-size: 1.5rem; margin-bottom: 5px; font-weight: 800; }
        .video-title p { color: var(--text-muted); font-size: 0.95rem; }
        .yt-wrapper { position: relative; width: 100%; padding-bottom: 56.25%; height: 0; background: #000; }
        .yt-wrapper iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        .video-footer { padding: 20px 30px; text-align: center; color: var(--text-muted); font-size: 0.95rem; background: rgba(0,0,0,0.02); }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        @media (max-width: 768px) {
            body { padding: 10px; }
            .video-header { padding: 15px 20px; flex-direction: column; text-align: center; gap: 10px; }
            .video-header i { font-size: 2rem; }
            .video-title h1 { font-size: 1.25rem; }
            .video-footer { padding: 15px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>
    <div class="video-container">
        <div class="video-header">
            <i class="fab fa-youtube"></i>
            <div class="video-title">
                <h1>ICT 1022 - CSA | Day 01 Recording</h1>
                <p>පළමු දින කුප්පි සැසිය (Computer Systems Architecture)</p>
            </div>
        </div>
        <div class="yt-wrapper">
            <iframe src="https://www.youtube.com/embed/vl95c5FoHaM" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
        </div>
        <div class="video-footer">
            <p>💡 <b>Tip:</b> අමතර කරුණු සහ වීඩියෝවේ සාකච්ඡා කරන කරුණු සඳහා අදාළ සටහන් (Notes) පරිශීලනය කරන්න.</p>
        </div>
    </div>
</body>
</html>
