<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM Clone - CSA Mind Map L6</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        :root {
            --bg-color: #131314; 
            --text-color: #e8eaed; 
            --node-bg: #28292a;
            --node-border: #5f6368;
            --link-color: #5f6368;
            --accent-green: #81c995;
            --accent-blue: #8ab4f8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Google Sans', 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #1f1f1f;
            border-bottom: 1px solid #333;
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-color);
        }

        .back-btn {
            background: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(138, 180, 248, 0.1);
        }

        #mindmap-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }
        
        #mindmap-container:active {
            cursor: grabbing;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .node-text {
            font-family: 'Google Sans', sans-serif;
            font-size: 15px;
            fill: var(--text-color);
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-sitemap"></i> L6: Instruction Set Architecture</h1>
    </div>

    <div id="mindmap-container"></div>

    <script>
        // Data Structure for L6
        const data = {
            name: "L6: Instruction Set Architecture",
            children: [
                {
                    name: "ISA Basics",
                    children: [
                        { name: "Interface between software & hardware" },
                        { name: "Programmer's view of the architecture" },
                        { name: "Survives across generations (e.g. x86)" }
                    ]
                },
                {
                    name: "Design Issues",
                    children: [
                        { name: "Operands", children: [{name:"Number: 0, 1, 2 or 3"}, {name:"Location: Register, Mem, ACC"}, {name:"Addressing Modes"}, {name:"Size: Byte to Double"}] },
                        { name: "Supported Operations", children: [{name:"ADD, SUB, MUL, JMP, etc."}] }
                    ]
                },
                {
                    name: "Evolution of ISAs",
                    children: [
                        { name: "Accumulator Based", children: [{name:"1 operand is implicitly the ACC"}] },
                        { name: "Stack Based", children: [{name:"0-address, uses Top of Stack (PUSH/POP)"}] },
                        { name: "Memory-Memory", children: [{name:"Operands direct from memory (No registers)"}] },
                        { name: "Register-Memory", children: [{name:"One in Register, one in Mem"}] },
                        { name: "Register-Register (Load-Store)", children: [{name:"Only LOAD/STORE access memory"}] }
                    ]
                },
                {
                    name: "General Purpose Registers (GPRs)",
                    children: [
                        { name: "Evolution", children: [{name:"Older: Special purpose (PC, SP, ACC)"}, {name:"Newer: Many GPRs (>32)"}] },
                        { name: "Why use GPRs?", children: [{name:"Faster than memory"}, {name:"Easy for compiler"}, {name:"Compact instruction encoding"}] },
                        { name: "Cons of Load-Store", children: [{name:"Overhead when saving/restoring during interrupts"}] }
                    ]
                }
            ]
        };

        // D3 setup
        const container = document.getElementById('mindmap-container');
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        const dx = 55; 
        const dy = 320; 

        const margin = {top: 20, right: 120, bottom: 20, left: 40};
        const tree = d3.tree().nodeSize([dx, dy]);

        const root = d3.hierarchy(data);
        root.x0 = height / 2;
        root.y0 = 0;

        root.descendants().forEach((d, i) => {
            d.id = i;
            d._children = d.children;
            if (d.depth && d.depth >= 1) d.children = null;
        });

        const svg = d3.select("#mindmap-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .style("user-select", "none");

        const g = svg.append("g");

        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
            
        svg.call(zoom);
        
        svg.call(zoom.transform, d3.zoomIdentity.translate(width/3, height/2).scale(0.8));

        const gLink = g.append("g")
            .attr("fill", "none")
            .attr("stroke", "var(--link-color)")
            .attr("stroke-width", 2);

        const gNode = g.append("g")
            .attr("cursor", "pointer")
            .attr("pointer-events", "all");

        function update(source) {
            const duration = 400;
            const nodes = root.descendants().reverse();
            const links = root.links();

            tree(root);

            nodes.forEach(d => {
                if (d.depth > 0) d.y = d.y + 150; 
            });

            const link = gLink.selectAll("path").data(links, d => d.target.id);
            
            function linkPath(s, t) {
                const sourceOffset = s.data.name.length * 8 + 30; 
                return `M ${s.y + sourceOffset} ${s.x} C ${(s.y + sourceOffset + t.y) / 2} ${s.x}, ${(s.y + sourceOffset + t.y) / 2} ${t.x}, ${t.y} ${t.x}`;
            }

            const linkEnter = link.enter().append("path")
                .attr("d", d => {
                    const o = {x: source.x0, y: source.y0, data: {name: ""}};
                    return linkPath(o, o);
                });

            link.merge(linkEnter).transition().duration(duration)
                .attr("d", d => linkPath(d.source, d.target));

            link.exit().transition().duration(duration)
                .attr("d", d => {
                    const o = {x: source.x, y: source.y, data: {name: ""}};
                    return linkPath(o, o);
                })
                .remove();

            const node = gNode.selectAll("g.node").data(nodes, d => d.id);

            const nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .attr("fill-opacity", 0)
                .attr("stroke-opacity", 0)
                .on("click", (event, d) => {
                    d.children = d.children ? null : d._children;
                    update(d);
                    
                    const currentScale = d3.zoomTransform(svg.node()).k;
                    const targetScale = Math.max(0.7, currentScale); 
                    const tx = (width / 3) - (d.y * targetScale);
                    const ty = (height / 2) - (d.x * targetScale);
                    
                    svg.transition()
                        .duration(duration * 1.5)
                        .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(targetScale));
                });

            nodeEnter.append("rect")
                .attr("rx", 8)
                .attr("ry", 8)
                .attr("height", 40)
                .attr("y", -20)
                .attr("fill", "var(--node-bg)")
                .attr("stroke", "var(--node-border)")
                .attr("stroke-width", 1)
                .style("transition", "stroke 0.2s");
                
            nodeEnter.append("text")
                .attr("class", "node-text")
                .attr("dy", "0.32em")
                .attr("x", 15)
                .text(d => d.data.name);

            nodeEnter.selectAll("rect")
                .attr("width", d => d.data.name.length * 8 + 30);

            nodeEnter.append("circle")
                .attr("class", "indicator-circle")
                .attr("cx", d => d.data.name.length * 8 + 30)
                .attr("cy", 0)
                .attr("r", 10)
                .attr("fill", "var(--bg-color)")
                .attr("stroke", "var(--accent-green)")
                .attr("stroke-width", 1.5)
                .style("display", d => d._children ? "inline" : "none");

            nodeEnter.append("text")
                .attr("class", "indicator-icon")
                .attr("x", d => d.data.name.length * 8 + 30)
                .attr("y", 1)
                .attr("dy", "0.32em")
                .attr("text-anchor", "middle")
                .attr("fill", "var(--accent-green)")
                .style("font-size", "14px")
                .style("font-weight", "bold")
                .style("pointer-events", "none")
                .style("display", d => d._children ? "inline" : "none")
                .text(d => d.children ? "<" : ">");

            nodeEnter.on("mouseover", function() {
                d3.select(this).select("rect").attr("stroke", "var(--text-color)");
            }).on("mouseout", function() {
                d3.select(this).select("rect").attr("stroke", "var(--node-border)");
            });

            const nodeUpdate = node.merge(nodeEnter).transition().duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`)
                .attr("fill-opacity", 1)
                .attr("stroke-opacity", 1);
                
            nodeUpdate.select(".indicator-icon")
                .text(d => d.children ? "<" : ">"); 

            const nodeExit = node.exit().transition().duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .attr("fill-opacity", 0)
                .attr("stroke-opacity", 0)
                .remove();

            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        update(root);
    </script>
</body>
</html>
