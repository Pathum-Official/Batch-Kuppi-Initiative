<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>L10 - Design of Control Unit Quiz</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Sans+Sinhala:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --success: #10b981;
            --danger: #ef4444;
            --correct-bg: #d1fae5;
            --wrong-bg: #fee2e2;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --primary: #6366f1;
                --primary-hover: #4f46e5;
                --bg-color: transparent;
                --card-bg: #1e293b;
                --text-main: #f1f5f9;
                --text-muted: #94a3b8;
                --correct-bg: rgba(16, 185, 129, 0.2);
                --wrong-bg: rgba(239, 68, 68, 0.2);
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', 'Noto Sans Sinhala', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .quiz-container {
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
            position: relative;
        }

        .quiz-header {
            background: linear-gradient(135deg, var(--primary), #818cf8);
            padding: 30px;
            color: white;
            text-align: center;
            position: relative;
        }

        .quiz-header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .quiz-header p {
            opacity: 0.9;
        }

        .progress-container {
            width: 100%;
            background: rgba(255, 255, 255, 0.2);
            height: 6px;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .progress-bar {
            height: 100%;
            background: #fff;
            width: 0%;
            transition: width 0.4s ease;
        }

        .question-wrapper {
            padding: 40px 30px;
            animation: fadeIn 0.5s ease;
        }

        .question-text {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .options-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: transparent;
            border: 2px solid var(--text-muted);
            color: var(--text-main);
            border-radius: 12px;
            padding: 15px 20px;
            font-size: 1rem;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-btn .opt-letter {
            font-weight: 800;
            margin-right: 15px;
            background: var(--text-muted);
            color: var(--card-bg);
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            flex-shrink: 0;
            transition: all 0.2s;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.1);
            transform: translateY(-2px);
        }

        .option-btn:hover:not(:disabled) .opt-letter {
            background: var(--primary);
        }

        .option-btn.correct {
            border-color: var(--success);
            background: var(--correct-bg);
            color: var(--success);
        }
        .option-btn.correct .opt-letter { background: var(--success); color: #fff; }

        .option-btn.wrong {
            border-color: var(--danger);
            background: var(--wrong-bg);
            color: var(--danger);
        }
        .option-btn.wrong .opt-letter { background: var(--danger); color: #fff; }

        .option-btn:disabled {
            cursor: not-allowed;
        }

        .explanation-box {
            display: none;
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            font-size: 0.95rem;
            line-height: 1.6;
            animation: slideDown 0.4s ease;
        }
        .explanation-box.show {
            display: block;
        }
        .explanation-box.success {
            background: var(--correct-bg);
            border-left: 4px solid var(--success);
            color: var(--text-main);
        }
        .explanation-box.error {
            background: var(--wrong-bg);
            border-left: 4px solid var(--danger);
            color: var(--text-main);
        }

        .next-btn-container {
            margin-top: 30px;
            text-align: right;
            display: none;
        }

        .next-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
        }
        .next-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .result-screen {
            display: none;
            text-align: center;
            padding: 60px 30px;
            animation: fadeIn 0.5s ease;
        }
        .result-screen i {
            font-size: 5rem;
            color: var(--success);
            margin-bottom: 20px;
        }
        .result-screen h2 { font-size: 2rem; margin-bottom: 10px; }
        .result-screen p { font-size: 1.2rem; color: var(--text-muted); margin-bottom: 30px; }
        
        .restart-btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 12px 30px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .restart-btn:hover {
            background: var(--primary);
            color: white;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="quiz-container">
        <div class="quiz-header">
            <h1>L10: Design of Control Unit MCQ Quiz</h1>
            <p id="quiz-status">Question 1 of 10</p>
            <div class="progress-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </div>

        <div id="quiz-body" class="question-wrapper">
            <div id="question-text" class="question-text">Loading question...</div>
            <div id="options-list" class="options-list"></div>
            
            <div id="explanation-box" class="explanation-box">
                <h4 style="margin-bottom: 5px;" id="explanation-title"></h4>
                <p id="explanation-text"></p>
            </div>

            <div id="next-btn-container" class="next-btn-container">
                <button id="next-btn" class="next-btn" onclick="nextQuestion()">Next Question <i class="fas fa-arrow-right"></i></button>
            </div>
        </div>

        <div id="result-screen" class="result-screen">
            <i class="fas fa-trophy"></i>
            <h2>Quiz Completed!</h2>
            <p>You scored <strong id="final-score">0</strong> out of <span id="total-questions">10</span>.</p>
            <button class="restart-btn" onclick="restartQuiz()"><i class="fas fa-redo"></i> Try Again</button>
        </div>
    </div>

    <script>
        const quizData = [
            {
                        "question": "01. Fetch-Execute Cycle හි පළමු පියවරේදී (Fetch) සිදුවන්නේ කුමක්ද?",
                        "options": [
                                    "උපදෙස ක්‍රියාත්මක කිරීම",
                                    "මතකයේ (Memory) ඇති උපදෙස (Instruction) ප්‍රොසෙසරයේ ඇති IR (Instruction Register) වෙත ගෙන ඒම",
                                    "දත්ත ගණනය කිරීම",
                                    "ප්‍රතිඵලය මතකයේ ගබඩා කිරීම",
                                    "Hard disk එකෙන් දත්ත ගෙන ඒම"
                        ],
                        "correctIndex": 1,
                        "explanation": "Fetch අදියරේදී සිදුවන්නේ මීළඟට ක්‍රියාත්මක විය යුතු උපදෙස Memory එකෙන් කියවාගෙන එය CPU එකේ IR රෙජිස්ටරය වෙත ගෙන ඒමයි."
            },
            {
                        "question": "02. Instruction Execution (උපදෙසක් ක්‍රියාත්මක වීම) සමන්විත වන ප්‍රධාන අවධි (Phases) 3 කුමක්ද?",
                        "options": [
                                    "Read, Write, Jump",
                                    "Fetch, Decode, Execute",
                                    "ALU, CU, Registers",
                                    "Input, Process, Output",
                                    "Start, Run, Stop"
                        ],
                        "correctIndex": 1,
                        "explanation": "සෑම උපදෙසක්ම Fetch (ගෙන ඒම), Decode (තේරුම් ගැනීම) සහ Execute (ක්‍රියාත්මක කිරීම) යන පියවර 3 ඔස්සේ ගමන් කරයි."
            },
            {
                        "question": "03. Fetch අදියරේදී PC (Program Counter) හි අගය MAR (Memory Address Register) වෙත යවන්නේ ඇයි?",
                        "options": [
                                    "PC හි අගය වෙනස් කිරීමට",
                                    "මීළඟට කියවිය යුතු උපදෙසේ ලිපිනය (Address) Memory එකට යැවීමට",
                                    "දත්ත ගණනය කිරීමට",
                                    "මතකය හිස් කිරීමට",
                                    "ALU එක පාලනය කිරීමට"
                        ],
                        "correctIndex": 1,
                        "explanation": "PC රෙජිස්ටරය තුළ ඇත්තේ මීළඟ උපදෙසේ ලිපිනයයි. මතකයෙන් එම උපදෙස කියවීමට නම් එම ලිපිනය අනිවාර්යයෙන්ම MAR වෙත යැවිය යුතුය."
            },
            {
                        "question": "04. Control Unit එක මඟින් නිකුත් කරන 'WMFC' (Wait for Memory Function Complete) සංඥාවෙන් අදහස් කරන්නේ කුමක්ද?",
                        "options": [
                                    "මතකය පිරී ඇති බව",
                                    "මතකයේ දෝෂයක් ඇති බව",
                                    "මතකයෙන් දත්තය කියවාගෙන අවසන් වනතුරු ප්‍රොසෙසරය බලා සිටිය යුතු බව (Pause execution)",
                                    "ප්‍රොසෙසරයේ වේගය අඩු කිරීම",
                                    "මෙය Memory-Mapped I/O සංඥාවකි"
                        ],
                        "correctIndex": 2,
                        "explanation": "මතකයේ වේගය ප්‍රොසෙසරයට වඩා අඩු බැවින්, Read හෝ Write සංඥාවක් යැවූ පසු මතකයේ එම කාර්යය අවසන් වනතුරු (MDR වෙත දත්තය එනතුරු) ප්‍රොසෙසරය මඳක් නැවතී සිටිය යුතුය (Wait)."
            },
            {
                        "question": "05. Single Bus Organization එකක ඇති ප්‍රධානතම දුර්වලතාවය කුමක්ද?",
                        "options": [
                                    "ඉතා වේගවත් වීම",
                                    "Hardware සංකීර්ණ වීම",
                                    "එකවර එක් දත්තයක් පමණක් ගමන් කළ හැකි බැවින් (Bottleneck) ක්‍රියාවලිය මන්දගාමී වීම",
                                    "බස් එකේ දිග වැඩි වීම",
                                    "රෙජිස්ටර් නොමැති වීම"
                        ],
                        "correctIndex": 2,
                        "explanation": "Single bus එකකදී සියලුම රෙජිස්ටර් සහ ALU සම්බන්ධ වී ඇත්තේ එක් පොදු බස් මාර්ගයකට බැවින්, එකවර යැවිය හැක්කේ එක් දත්තයක් පමණි. මෙය වේගය සීමා කරයි."
            },
            {
                        "question": "06. Single Bus ව්‍යුහයක් තුළ ALU හි Input දෙකක් (A සහ B) ලබා දීමට භාවිතා කරන තාවකාලික රෙජිස්ටරය කුමක්ද?",
                        "options": [
                                    "PC",
                                    "IR",
                                    "Y",
                                    "Z",
                                    "MAR"
                        ],
                        "correctIndex": 2,
                        "explanation": "Single bus එකක් හරහා එකවර දත්ත දෙකක් යැවිය නොහැකි බැවින්, පළමු දත්තය යවා එය තාවකාලිකව 'Y' රෙජිස්ටරයේ ගබඩා කර, දෙවන දත්තය කෙලින්ම බස් එක හරහා ALU වෙත යවයි."
            },
            {
                        "question": "07. ALU එකෙන් ලැබෙන පිළිතුර නැවත බස් එකට යැවීමට පෙර තාවකාලිකව රඳවා ගන්නා රෙජිස්ටරය කුමක්ද?",
                        "options": [
                                    "Y",
                                    "Z",
                                    "MDR",
                                    "PC",
                                    "IR"
                        ],
                        "correctIndex": 1,
                        "explanation": "ALU හි ගණනය කිරීම අවසන් වූ පසු, එම පිළිතුර කෙලින්ම බස් එකට නොයවා පළමුව 'Z' නම් තාවකාලික රෙජිස්ටරයේ ගබඩා කරයි. ඉන්පසු $Z_{out}$ සංඥාව මඟින් එය බස් එකට යවයි."

        let currentQuestion = 0;
        let score = 0;
        const letters = ['A', 'B', 'C', 'D', 'E'];

        const questionText = document.getElementById('question-text');
        const optionsList = document.getElementById('options-list');
        const explanationBox = document.getElementById('explanation-box');
        const explanationTitle = document.getElementById('explanation-title');
        const explanationText = document.getElementById('explanation-text');
        const nextBtnContainer = document.getElementById('next-btn-container');
        const nextBtn = document.getElementById('next-btn');
        const progressBar = document.getElementById('progress-bar');
        const quizStatus = document.getElementById('quiz-status');
        const quizBody = document.getElementById('quiz-body');
        const resultScreen = document.getElementById('result-screen');

        function loadQuestion() {
            const q = quizData[currentQuestion];
            questionText.innerText = q.question;
            optionsList.innerHTML = '';
            explanationBox.className = 'explanation-box';
            nextBtnContainer.style.display = 'none';

            q.options.forEach((opt, index) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerHTML = `<span class="opt-letter">${letters[index]}</span> <span>${opt}</span>`;
                btn.onclick = () => selectOption(index, btn);
                optionsList.appendChild(btn);
            });

            const progress = ((currentQuestion) / quizData.length) * 100;
            progressBar.style.width = `${progress}%`;
            quizStatus.innerText = `Question ${currentQuestion + 1} of ${quizData.length}`;
        }

        function selectOption(selectedIndex, btnElement) {
            const q = quizData[currentQuestion];
            const isCorrect = (selectedIndex === q.correctIndex);
            
            // Disable all buttons
            const allBtns = optionsList.querySelectorAll('.option-btn');
            allBtns.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx === q.correctIndex) {
                    btn.classList.add('correct');
                }
            });

            if (isCorrect) {
                score++;
                explanationBox.classList.add('success');
                explanationTitle.innerHTML = '<i class="fas fa-check-circle"></i> හරියටම හරි! (Correct)';
            } else {
                btnElement.classList.add('wrong');
                explanationBox.classList.add('error');
                explanationTitle.innerHTML = '<i class="fas fa-times-circle"></i> වැරදියි! (Incorrect)';
            }

            explanationText.innerText = q.explanation;
            explanationBox.classList.add('show');
            
            if (currentQuestion === quizData.length - 1) {
                nextBtn.innerHTML = 'View Results <i class="fas fa-flag-checkered"></i>';
            } else {
                nextBtn.innerHTML = 'Next Question <i class="fas fa-arrow-right"></i>';
            }
            nextBtnContainer.style.display = 'block';
        }

        function nextQuestion() {
            currentQuestion++;
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizBody.style.display = 'none';
            resultScreen.style.display = 'block';
            progressBar.style.width = '100%';
            quizStatus.innerText = 'Quiz Completed!';
            document.getElementById('final-score').innerText = score;
            document.getElementById('total-questions').innerText = quizData.length;
        }

        function restartQuiz() {
            currentQuestion = 0;
            score = 0;
            quizBody.style.display = 'block';
            resultScreen.style.display = 'none';
            loadQuestion();
        }

        // Initialize first question
        loadQuestion();
    </script>
