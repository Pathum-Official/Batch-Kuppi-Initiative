<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotebookLM Clone - CSA Mind Map L1</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- D3.js -->
    <script src="https://d3js.org/d3.v7.min.js"></script>

    <style>
        :root {
            --bg-color: #131314; /* Exact NotebookLM Dark BG */
            --text-color: #e8eaed; /* NotebookLM Text */
            --node-bg: #28292a;
            --node-border: #5f6368;
            --link-color: #5f6368;
            --accent-green: #81c995;
            --accent-blue: #8ab4f8;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Google Sans', 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 24px;
            background: #1f1f1f;
            border-bottom: 1px solid #333;
            z-index: 10;
        }

        .header h1 {
            margin: 0;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 12px;
            color: var(--text-color);
        }

        .back-btn {
            background: transparent;
            color: var(--accent-blue);
            border: 1px solid var(--accent-blue);
            padding: 6px 16px;
            border-radius: 4px;
            font-weight: 500;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(138, 180, 248, 0.1);
        }

        #mindmap-container {
            flex: 1;
            width: 100%;
            height: 100%;
            position: relative;
            cursor: grab;
        }
        
        #mindmap-container:active {
            cursor: grabbing;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .node-text {
            font-family: 'Google Sans', sans-serif;
            font-size: 15px;
            fill: var(--text-color);
            user-select: none;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><i class="fas fa-book"></i> L1: Introduction to Computer Systems Architecture</h1>
        <a href="./?note=00_Table_of_Contents.md" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Notes</a>
    </div>

    <div id="mindmap-container"></div>

    <script>
        // Data Structure for L1
        const data = {
            name: "L1: Intro to Computer System Architecture",
            children: [
                {
                    name: "Org vs Arch",
                    children: [
                        { name: "Computer Organization", children: [{name:"Hardware components & physical integration"}, {name:"Analogy: Civil Engineer"}] },
                        { name: "Computer Architecture", children: [{name:"System design & programmer's view"}, {name:"Analogy: Architect"}] }
                    ]
                },
                {
                    name: "Historical Evolution",
                    children: [
                        { name: "Early Machines", children: [{name:"Pascaline (1642)"}, {name:"Babbage Engine (19th C)"}, {name:"Harvard Mark 1 (1944)"}] },
                        { name: "Computer Generations", children: [{name:"G1: Vacuum Tubes (ENIAC)"}, {name:"G2: Transistors"}, {name:"G3: ICs (SSI/MSI)"}, {name:"G4: LSI/VLSI"}, {name:"G5: VLSI Multi-core"}, {name:"G6: ULSI (Core i7, etc)"}] },
                        { name: "Moore's Law", children: [{name:"Transistors per square inch doubles ~every 18 months"}] }
                    ]
                },
                {
                    name: "Computer Components",
                    children: [
                        { name: "Von-Neumann Architecture", children: [{name:"Instructions and data share the same memory"}] },
                        { name: "CPU (Processor)", children: [{name:"ALU: Arithmetic & Logic Calculations"}, {name:"Control Unit: Nerve center, decodes and controls"}] },
                        { name: "Memory Unit", children: [{name:"Primary: RAM, ROM (Active execution)"}, {name:"Secondary: Disks, Flash (Permanent backup)"}, {name:"Hierarchy: L1/L2/L3 Caches for speed vs cost"}] },
                        { name: "I/O Units", children: [{name:"Input: Keyboard, Mouse"}, {name:"Output: Monitor, Printer, Speaker"}] }
                    ]
                }
            ]
        };

        // D3 setup
        const container = document.getElementById('mindmap-container');
        const width = container.clientWidth;
        const height = container.clientHeight;
        
        const dx = 55; // Vertical distance between nodes (prevents overlap)
        const dy = 320; // Horizontal distance between branches

        const margin = {top: 20, right: 120, bottom: 20, left: 40};
        const tree = d3.tree().nodeSize([dx, dy]);

        const root = d3.hierarchy(data);
        root.x0 = height / 2;
        root.y0 = 0;

        // Start with only the first level expanded (Collapse all depth >= 1)
        root.descendants().forEach((d, i) => {
            d.id = i;
            d._children = d.children;
            if (d.depth && d.depth >= 1) d.children = null;
        });

        const svg = d3.select("#mindmap-container").append("svg")
            .attr("width", "100%")
            .attr("height", "100%")
            .style("user-select", "none");

        const g = svg.append("g");

        // Pan and Zoom
        const zoom = d3.zoom()
            .scaleExtent([0.1, 3])
            .on("zoom", (event) => {
                g.attr("transform", event.transform);
            });
            
        svg.call(zoom);
        
        // Initial center position
        svg.call(zoom.transform, d3.zoomIdentity.translate(width/3, height/2).scale(0.8));

        const gLink = g.append("g")
            .attr("fill", "none")
            .attr("stroke", "var(--link-color)")
            .attr("stroke-width", 2);

        const gNode = g.append("g")
            .attr("cursor", "pointer")
            .attr("pointer-events", "all");

        function update(source) {
            const duration = 400;
            const nodes = root.descendants().reverse();
            const links = root.links();

            // Compute the new tree layout.
            tree(root);

            // Push children further away from root to give more breathing room
            nodes.forEach(d => {
                if (d.depth > 0) {
                    d.y = d.y + 150; 
                }
            });

            // Update links
            const link = gLink.selectAll("path").data(links, d => d.target.id);
            
            // Custom bezier curve to connect from right edge of parent rect to left edge of child
            function linkPath(s, t) {
                const sourceOffset = s.data.name.length * 8 + 30; 
                return `M ${s.y + sourceOffset} ${s.x} C ${(s.y + sourceOffset + t.y) / 2} ${s.x}, ${(s.y + sourceOffset + t.y) / 2} ${t.x}, ${t.y} ${t.x}`;
            }

            const linkEnter = link.enter().append("path")
                .attr("d", d => {
                    const o = {x: source.x0, y: source.y0, data: {name: ""}};
                    return linkPath(o, o);
                });

            link.merge(linkEnter).transition().duration(duration)
                .attr("d", d => linkPath(d.source, d.target));

            link.exit().transition().duration(duration)
                .attr("d", d => {
                    const o = {x: source.x, y: source.y, data: {name: ""}};
                    return linkPath(o, o);
                })
                .remove();

            // Update nodes
            const node = gNode.selectAll("g.node").data(nodes, d => d.id);

            const nodeEnter = node.enter().append("g")
                .attr("class", "node")
                .attr("transform", d => `translate(${source.y0},${source.x0})`)
                .attr("fill-opacity", 0)
                .attr("stroke-opacity", 0)
                .on("click", (event, d) => {
                    d.children = d.children ? null : d._children;
                    update(d);
                    
                    // Auto-center the clicked node smoothly (NotebookLM style)
                    const currentScale = d3.zoomTransform(svg.node()).k;
                    const targetScale = Math.max(0.7, currentScale); 
                    const tx = (width / 3) - (d.y * targetScale);
                    const ty = (height / 2) - (d.x * targetScale);
                    
                    svg.transition()
                        .duration(duration * 1.5)
                        .call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(targetScale));
                });

            nodeEnter.append("rect")
                .attr("rx", 8)
                .attr("ry", 8)
                .attr("height", 40)
                .attr("y", -20)
                .attr("fill", "var(--node-bg)")
                .attr("stroke", "var(--node-border)")
                .attr("stroke-width", 1)
                .style("transition", "stroke 0.2s");
                
            nodeEnter.append("text")
                .attr("class", "node-text")
                .attr("dy", "0.32em")
                .attr("x", 15)
                .text(d => d.data.name);

            // Dynamic rect width based on text length
            nodeEnter.selectAll("rect")
                .attr("width", d => d.data.name.length * 8 + 30);

            // Expand/Collapse Indicator Circle
            nodeEnter.append("circle")
                .attr("class", "indicator-circle")
                .attr("cx", d => d.data.name.length * 8 + 30)
                .attr("cy", 0)
                .attr("r", 10)
                .attr("fill", "var(--bg-color)")
                .attr("stroke", "var(--accent-green)")
                .attr("stroke-width", 1.5)
                .style("display", d => d._children ? "inline" : "none");

            nodeEnter.append("text")
                .attr("class", "indicator-icon")
                .attr("x", d => d.data.name.length * 8 + 30)
                .attr("y", 1)
                .attr("dy", "0.32em")
                .attr("text-anchor", "middle")
                .attr("fill", "var(--accent-green)")
                .style("font-size", "14px")
                .style("font-weight", "bold")
                .style("pointer-events", "none")
                .style("display", d => d._children ? "inline" : "none")
                .text(d => d.children ? "<" : ">"); // NotebookLM style arrows

            // Hover effects
            nodeEnter.on("mouseover", function() {
                d3.select(this).select("rect").attr("stroke", "var(--text-color)");
            }).on("mouseout", function() {
                d3.select(this).select("rect").attr("stroke", "var(--node-border)");
            });

            const nodeUpdate = node.merge(nodeEnter).transition().duration(duration)
                .attr("transform", d => `translate(${d.y},${d.x})`)
                .attr("fill-opacity", 1)
                .attr("stroke-opacity", 1);
                
            nodeUpdate.select(".indicator-icon")
                .text(d => d.children ? "<" : ">"); // Change icon on expand/collapse

            const nodeExit = node.exit().transition().duration(duration)
                .attr("transform", d => `translate(${source.y},${source.x})`)
                .attr("fill-opacity", 0)
                .attr("stroke-opacity", 0)
                .remove();

            // Store old positions for transition
            nodes.forEach(d => {
                d.x0 = d.x;
                d.y0 = d.y;
            });
        }

        update(root);
    </script>
</body>
</html>
